server 
{
	listen 127.0.0.1:8080;

	server_name localhost;

	root html;

	index index.html index.htm;

	error_page 404 html/error/404.html;

	location /
	{
		autoindex on;
		root html;
		methods GET;
	}

	location /cgi-bin/
	{
		root html/;
		cgi_extension .py;
		cgi_enable on;
		cgi_path /usr/bin/python3;
		methods POST GET;
	}

	location /media
	{
		index index.html;
		root html;
		return 404 html/error/404.html;
	}
}
